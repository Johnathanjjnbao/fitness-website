<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản lý Programs | FORGEFIT</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../assets/js/supabase-client.js" defer></script>
  <script src="../../assets/js/admin-auth.js" defer></script>
  <script src="../../assets/js/admin-programs.js" defer></script>
</head>
<body class="admin-page" data-admin-page="programs">
  <header class="admin-header">
    <a class="brand" href="../../index.html" aria-label="FORGEFIT - Trang chủ">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>FORGE<span class="brand-slash">//</span>FIT</span>
    </a>
    <button class="button button-secondary admin-logout" type="button" data-admin-logout>Đăng xuất</button>
  </header>

  <main class="admin-workspace-shell">
    <p class="admin-loading" data-admin-loading role="status">Đang kiểm tra quyền truy cập…</p>

    <section class="admin-workspace" data-admin-content hidden aria-labelledby="admin-programs-title">
      <nav class="admin-breadcrumb" aria-label="Điều hướng quản trị">
        <a href="../">Dashboard</a>
        <span aria-hidden="true">/</span>
        <span>Programs</span>
      </nav>

      <div class="admin-workspace-heading">
        <div>
          <p class="eyebrow">FORGEFIT Admin</p>
          <h1 id="admin-programs-title">Programs</h1>
          <p class="admin-intro">Quản lý nội dung bảng giá tiếng Việt và tiếng Hàn.</p>
        </div>
        <p class="admin-user-line">Đăng nhập: <strong data-admin-email></strong></p>
      </div>

      <div class="admin-program-layout">
        <section class="admin-panel" aria-labelledby="program-list-title">
          <div class="admin-panel-heading">
            <div>
              <p class="eyebrow">Danh sách</p>
              <h2 id="program-list-title">Các gói tập</h2>
            </div>
            <button class="button button-primary admin-small-button" type="button" data-program-new>Thêm gói</button>
          </div>
          <p class="admin-list-status" data-program-list-status role="status">Đang tải dữ liệu…</p>
          <div class="admin-program-list" data-program-list></div>
        </section>

        <section class="admin-panel" aria-labelledby="program-form-title">
          <div class="admin-panel-heading">
            <div>
              <p class="eyebrow">Biểu mẫu</p>
              <h2 id="program-form-title" data-program-form-title>Thêm gói tập</h2>
            </div>
          </div>

          <form class="admin-program-form" data-program-form novalidate>
            <input name="id" type="hidden">

            <div class="admin-form-grid">
              <div class="form-group">
                <label for="program-name-vi">Tên tiếng Việt</label>
                <input id="program-name-vi" name="name_vi" type="text" required>
              </div>
              <div class="form-group">
                <label for="program-name-ko">Tên tiếng Hàn</label>
                <input id="program-name-ko" name="name_ko" type="text" required>
              </div>
              <div class="form-group">
                <label for="program-description-vi">Mô tả tiếng Việt</label>
                <textarea id="program-description-vi" name="description_vi" rows="3" required></textarea>
              </div>
              <div class="form-group">
                <label for="program-description-ko">Mô tả tiếng Hàn</label>
                <textarea id="program-description-ko" name="description_ko" rows="3" required></textarea>
              </div>
              <div class="form-group">
                <label for="program-features-vi">Quyền lợi tiếng Việt</label>
                <textarea id="program-features-vi" name="features_vi" rows="6" aria-describedby="features-vi-help"></textarea>
                <small id="features-vi-help">Mỗi quyền lợi nằm trên một dòng.</small>
              </div>
              <div class="form-group">
                <label for="program-features-ko">Quyền lợi tiếng Hàn</label>
                <textarea id="program-features-ko" name="features_ko" rows="6" aria-describedby="features-ko-help"></textarea>
                <small id="features-ko-help">Mỗi quyền lợi nằm trên một dòng.</small>
              </div>
              <div class="form-group">
                <label for="program-price">Giá (VND)</label>
                <input id="program-price" name="price_vnd" type="number" min="0" step="1" inputmode="numeric" required>
              </div>
              <div class="form-group">
                <label for="program-order">Thứ tự hiển thị</label>
                <input id="program-order" name="display_order" type="number" min="1" step="1" inputmode="numeric" required>
              </div>
            </div>

            <label class="admin-checkbox">
              <input name="active" type="checkbox" checked>
              <span>Hiển thị gói này trên website</span>
            </label>

            <p class="admin-status" data-program-form-status aria-live="polite"></p>

            <div class="admin-form-actions">
              <button class="button button-primary admin-save-button" type="submit">Lưu gói tập</button>
              <button class="button button-secondary admin-cancel-button" type="button" data-program-cancel hidden>Hủy chỉnh sửa</button>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
